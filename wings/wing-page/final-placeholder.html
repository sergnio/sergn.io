:root {
  --neutral-100: hsl(36 16% 94%);
  --neutral-600: hsl(24 3% 37%);
  --mauve-100: hsl(320 9% 93%);
  --mauve-200: hsl(320 8% 86%);
  --mauve-300: hsl(323 15% 76%);
  --mauve-500: hsl(321 15% 50%);
  --mauve-700: hsl(321 14% 32%);
  --mauve-900: hsl(320 10% 17%);
  --red-600: hsl(0 33% 40%);
  --red-700: hsl(0 34% 32%);
  --paper: var(--neutral-100);
  --card: var(--mauve-100);
  --ink: var(--mauve-900);
  --muted: var(--neutral-600);
  --line: var(--mauve-200);
  --brand: var(--mauve-900);
  --accent: var(--mauve-700);
  --highlight: var(--red-600);
  --placeholder: var(--mauve-300);
  --wash: var(--mauve-200);
  --wash-ink: var(--mauve-700);
  --tint: var(--mauve-500);
  --focus: var(--red-700);
  --shadow: rgb(38 36 36 / 8%);
  --mono: 'DM Mono', ui-monospace, monospace;
  font-family: 'Newsreader', Georgia, serif;
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
}
body { margin: 0; padding: 2.5rem 2rem 3rem; color: var(--ink); background: var(--paper); font-family: 'DM Mono', monospace; }
h1 { margin: 0 0 0.4rem; color: var(--brand); font-size: 1.1rem; font-weight: 500; }
p { margin: 0 0 2rem; color: var(--muted); font-size: 0.75rem; }
/* The placeholder itself: copy from here to the end of this block. */
.wing-ph {
  --wing-ph-ink: var(--wash-ink);
  --wing-ph-stroke: 2.25px;
  --wing-ph-size: 54%;
  container-type: inline-size;
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: var(--wing-ph-ink);
  background: linear-gradient(160deg, color-mix(in srgb, var(--wash) 90%, var(--paper)), var(--paper) 85%);
  border: 1px dashed var(--placeholder);
}
.wing-ph__art {
  width: var(--wing-ph-size);
  height: auto;
  aspect-ratio: 1;
  overflow: visible;
  fill: none;
  stroke: currentColor;
  stroke-width: var(--wing-ph-stroke);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: calc(var(--wing-ph-stroke) * 2.4) calc(var(--wing-ph-stroke) * 2.2);
}
.wing-ph__art * { vector-effect: non-scaling-stroke; }
.wing-ph__caption {
  display: none;
  position: absolute;
  bottom: 9%;
  left: 0;
  right: 0;
  margin: 0;
  color: var(--wing-ph-ink);
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  font-weight: 400;
  letter-spacing: 0.06em;
  text-align: center;
  text-transform: uppercase;
}
@container (min-width: 15rem) {
  .wing-ph__caption { display: block; }
  .wing-ph__art { transform: translateY(-6%); }
}
.wing-ph--hero { --wing-ph-stroke: 3px; --wing-ph-size: 42%; }
.wing-ph--thumb { --wing-ph-stroke: 1.5px; --wing-ph-size: 92%; }
.wing-ph--tiny { --wing-ph-stroke: 1.25px; }
/* Specimen layout for this page only. */
.spec { display: grid; gap: 2rem; margin: 0 0 2rem; }
.spec__row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1.5rem 1.75rem; }
.spec figure { margin: 0; }
.spec figcaption { margin-top: 0.5rem; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.66rem; }
.spec figcaption b { color: var(--brand); font-weight: 500; }
.spec__card { display: flex; align-items: flex-end; gap: 1.25rem; padding: 0.55rem 1.25rem 0.55rem 0.55rem; background: var(--card); border: 1px solid var(--line); border-radius: 0.25rem; }
</style>
</head>
