# Pins local development to the same Node major that CI (.github/workflows/*.yml)
# and production (netlify.toml NODE_VERSION) run on.
#
# This is not cosmetic. Node 24 ships npm 11, which resolves unsatisfied optional
# peer dependencies differently than the npm 10 that Node 22 ships: it omits them,
# where npm 10 installs a nested copy. A package-lock.json generated by npm 11 is
# therefore missing entries npm 10 requires, and every `npm ci` on the Node 22
# target fails with EUSAGE. Regenerate the lock on this pinned version.
[tools]
node = "22"
