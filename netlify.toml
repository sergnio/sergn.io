[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

[[redirects]]
  from = "/syrup"
  to = "/retired-content"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/not-found"
  status = 404

# Everything under /assets is emitted by Vite with a content hash in its
# filename, so a new build always produces a new URL. Netlify's default of
# max-age=0, must-revalidate costs a revalidation round trip per asset on
# every repeat visit; these files can be cached forever instead.
# /__tsr/* is deliberately left on the default: those filenames hash the
# server-function call, not the response, so the same URL changes content
# when the dataset changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
