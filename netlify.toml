[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

[[redirects]]
  from = "/syrup"
  to = "/retired-content"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/not-found"
  status = 404

# Everything under /assets is emitted by Vite with a content hash in its
# filename, so a new build always produces a new URL. Netlify's default of
# max-age=0, must-revalidate costs a revalidation round trip per asset on
# every repeat visit; these files can be cached forever instead.
# /__tsr/* is deliberately left on the default: those filenames hash the
# server-function call, not the response, so the same URL changes content
# when the dataset changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font filenames carry the family version Google publishes (v16, v26), so a
# font that actually changes lands at a new URL. Regenerate with
# scripts/generate-fonts.mjs.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers for every response. The site is fully static, so
# these are the only place they can be set.
# The CSP allows 'unsafe-inline' for scripts because TanStack Start emits an
# inline hydration-payload script per page and Netlify cannot mint a nonce for
# static files; the policy still blocks script loads from any other origin,
# which is the realistic injection vector here.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://cdn.sanity.io; connect-src 'self' https://cdn.sanity.io https://*.api.sanity.io https://*.apicdn.sanity.io"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
