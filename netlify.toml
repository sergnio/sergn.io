[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

[[redirects]]
  from = "/syrup"
  to = "/retired-content"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/not-found"
  status = 404
